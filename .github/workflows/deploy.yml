name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: |
          npm run build
          printf '%s\n' "$GITHUB_SHA" > out/deployment-revision.txt
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live website
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in $(seq 1 30); do
            revision=$(curl --fail --silent --show-error --max-time 15 "${SITE_URL}deployment-revision.txt?revision=${GITHUB_SHA}&attempt=${attempt}" || true)
            if [ "$revision" = "$GITHUB_SHA" ]; then
              html=$(curl --fail --silent --show-error --max-time 30 "${SITE_URL}?revision=${GITHUB_SHA}")
              grep -q '/_next/static/' <<< "$html"
              exit 0
            fi
            sleep 10
          done
          echo "The live website does not match this deployment."
          exit 1
